spring.datasource.url=jdbc:h2:file:${HOMELAB_DATA_DIR:./data}/analytics;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HOMELAB_SECURE_COOKIE:false}

homelab.admin.username=${HOMELAB_ADMIN_USERNAME:}
homelab.admin.password=${HOMELAB_ADMIN_PASSWORD:}
